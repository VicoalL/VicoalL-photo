<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讨论区 — VicoalL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --ink:#f2f2f4;
  --dim:rgb(255 255 255 / .5);
  --hair:rgb(255 255 255 / .14);
  --card:rgb(255 255 255 / .045);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#08080b;color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
input,textarea,button{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}

.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,3vw,32px);
  border-bottom:1px solid var(--hair);
  background:rgba(8,8,11,.85);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
}
.back{display:inline-flex;align-items:center;gap:7px;opacity:.85}
.back:hover{opacity:.5}
.who{display:flex;align-items:center;gap:12px;color:var(--dim)}
.who b{color:var(--ink);font-weight:400}
.mini{
  cursor:pointer;padding:6px 12px;border-radius:999px;
  color:var(--ink);background:rgb(255 255 255 / .08);
  border:1px solid var(--hair);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
}
.mini:hover{background:rgb(255 255 255 / .16)}

.head{padding:clamp(28px,5vw,64px) 0 clamp(14px,2vw,22px)}
h1{margin:0;font-size:clamp(32px,5.6vw,68px);line-height:.98;font-weight:400;letter-spacing:-.035em}
.head p{margin:14px 0 0;color:var(--dim);font-size:14px;line-height:1.7;max-width:54ch}

/* tabs */
.tabs{display:flex;gap:8px;margin:clamp(18px,2.4vw,28px) 0 0}
.tab{
  cursor:pointer;padding:10px 18px;border-radius:999px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--hair);
  transition:all .25s var(--ease-soft);
}
.tab.on{color:#08080b;background:#fff;border-color:#fff}
.tab:hover:not(.on){color:var(--ink);border-color:rgb(255 255 255 / .4)}

/* 登录 */
.panel{
  margin:clamp(20px,2.6vw,32px) 0 0;padding:clamp(18px,2.4vw,28px);
  border:1px solid var(--hair);background:var(--card);border-radius:14px;
}
.panel h2{margin:0 0 6px;font-size:18px;font-weight:400}
.panel .sub{margin:0 0 18px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.05em}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.field input{
  width:100%;padding:11px 13px;border-radius:9px;
  color:var(--ink);background:rgb(0 0 0 / .45);
  border:1px solid var(--hair);outline:none;font-size:14px;
  transition:border-color .25s,background .25s;
}
.field input:focus{border-color:rgb(255 255 255 / .55);background:rgb(0 0 0 / .6)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.btn{
  cursor:pointer;padding:11px 22px;border-radius:999px;border:1px solid #fff;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#08080b;background:#fff;transition:opacity .25s,transform .25s;
}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn.ghost{color:var(--ink);background:transparent;border-color:var(--hair)}
.btn.ghost:hover{border-color:rgb(255 255 255 / .5)}
.msg{font-family:var(--mono);font-size:11px;color:#ff9b9b;min-height:16px}

/* 第三方登录（未配置） */
.oauth{display:flex;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--hair)}
.oa{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px;border-radius:9px;border:1px dashed rgb(255 255 255 / .22);
  font-family:var(--mono);font-size:11px;color:rgb(255 255 255 / .38);
  cursor:not-allowed;position:relative;
}
.oa em{font-style:normal;font-size:9px;opacity:.7}
.oa:hover::after{
  content:"需要微信开放平台 / QQ 互联的 appid，且域名已备案";
  position:absolute;left:50%;translate:-50% 0;bottom:calc(100% + 8px);
  white-space:nowrap;padding:7px 11px;border-radius:7px;
  background:#15151b;border:1px solid var(--hair);
  font-size:10px;color:var(--ink);
}

/* 发帖 */
.compose{display:none;margin:22px 0 0}
.compose.on{display:block}
.compose textarea{
  width:100%;min-height:96px;resize:vertical;padding:13px;border-radius:9px;
  color:var(--ink);background:rgb(0 0 0 / .45);border:1px solid var(--hair);
  font-size:14px;line-height:1.6;outline:none;
}
.compose textarea:focus{border-color:rgb(255 255 255 / .5)}

/* 列表 */
.list{margin:clamp(22px,3vw,34px) 0 clamp(60px,8vw,110px);display:flex;flex-direction:column;gap:14px}
.post{
  border:1px solid var(--hair);border-radius:14px;background:var(--card);
  padding:clamp(16px,2vw,22px);transition:border-color .3s;
}
.post:hover{border-color:rgb(255 255 255 / .28)}
.post .meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em;
}
.post .meta b{font-weight:400;color:var(--ink)}
.post h3{margin:10px 0 0;font-size:19px;font-weight:400;letter-spacing:-.01em;line-height:1.35}
.post p.body{margin:8px 0 0;font-size:14px;line-height:1.75;color:rgb(255 255 255 / .78);white-space:pre-wrap}
.post .bar{display:flex;align-items:center;gap:8px;margin-top:14px}
.pill{
  cursor:pointer;padding:6px 13px;border-radius:999px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:var(--dim);background:transparent;border:1px solid var(--hair);
  transition:all .22s;
}
.pill:hover{color:var(--ink);border-color:rgb(255 255 255 / .4)}
.pill.liked{color:#08080b;background:#fff;border-color:#fff}
.replies{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--hair);display:none;flex-direction:column;gap:12px}
.replies.on{display:flex}
.reply{font-size:13.5px;line-height:1.7;color:rgb(255 255 255 / .8)}
.reply .who2{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-right:8px}
.replyform{display:flex;gap:8px;margin-top:4px}
.replyform input{
  flex:1;padding:9px 12px;border-radius:8px;color:var(--ink);
  background:rgb(0 0 0 / .45);border:1px solid var(--hair);font-size:13px;outline:none;
}
.empty{
  padding:44px 0;text-align:center;color:var(--dim);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
}

@media (max-width:760px){
  .fields{grid-template-columns:1fr}
  .oauth{flex-direction:column}
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html"><span>←</span> 返回</a>
  <div class="who" id="who"><span>未登录</span></div>
</header>

<main class="wrap">
  <div class="head">
    <h1>说话的地方</h1>
    <p>讨论区聊照片和器材；灵感墙放任何还没成型的想法——拍摄计划、想拍的角度、想一起去的地方。</p>
  </div>

  <!-- 登录 / 注册 -->
  <section class="panel" id="authPanel">
    <h2 id="authTitle">登录 / 注册</h2>
    <p class="sub">账号用 11 位手机号或自己的昵称；密码至少 6 位</p>
    <div class="fields">
      <div class="field"><label>账号</label><input id="account" placeholder="手机号 或 昵称" autocomplete="username"></div>
      <div class="field"><label>昵称</label><input id="nick" placeholder="注册时填，登录可留空" autocomplete="nickname"></div>
      <div class="field"><label>密码</label><input id="pass" type="password" placeholder="至少 6 位" autocomplete="current-password"></div>
    </div>
    <div class="acts">
      <button class="btn" id="btnLogin" type="button">登录</button>
      <button class="btn ghost" id="btnReg" type="button">注册</button>
      <span class="msg" id="authMsg"></span>
    </div>
    <div class="oauth">
      <button class="oa" type="button" disabled>微信登录 <em>未配置</em></button>
      <button class="oa" type="button" disabled>QQ 登录 <em>未配置</em></button>
    </div>
  </section>

  <!-- 已登录 -->
  <section class="panel" id="mePanel" style="display:none">
    <h2 id="meTitle">欢迎</h2>
    <p class="sub" id="meSub"></p>
    <div class="acts"><button class="btn ghost" id="btnLogout" type="button">退出登录</button></div>
  </section>

  <div class="tabs">
    <button class="tab on" data-topic="board" type="button">讨论区</button>
    <button class="tab" data-topic="idea" type="button">灵感墙</button>
  </div>

    <section class="panel" id="uploadPanel" style="margin-top:22px">
    <h2>照片投稿</h2>
    <p class="sub">支持 JPG / PNG / WebP，自动压到长边 2000px，单张上限 4MB；投稿需审核后展示</p>
    <div class="acts" style="margin-top:14px">
      <input id="upFile" type="file" accept="image/*" hidden>
      <button class="btn ghost" id="btnPick" type="button">选择照片</button>
      <input id="upTitle" placeholder="给这张照片起个名字（可空）" style="flex:1;min-width:180px;padding:11px 13px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--hair);color:#fff;outline:none">
      <span class="msg" id="upMsg"></span>
    </div>
    <div class="list" id="upList" style="margin:18px 0 0"></div>
  </section>
<section class="compose" id="compose">
    <div class="field" id="titleField">
      <label>标题</label>
      <input id="postTitle" placeholder="一句话说清楚" maxlength="80">
    </div>
    <div class="field" style="margin-top:12px">
      <label>内容</label>
      <textarea id="postBody" placeholder="想说的写在这里…" maxlength="2000"></textarea>
    </div>
    <div class="acts">
      <button class="btn" id="btnPost" type="button">发布</button>
      <span class="msg" id="postMsg"></span>
    </div>
  </section>

  <section class="list" id="list"></section>
</main>

<script>
(() => {
  "use strict";
  let topic = "board";
  let me = null;

  const $ = s => document.querySelector(s);
  const authPanel = $("#authPanel"), mePanel = $("#mePanel"), compose = $("#compose");
  const listEl = $("#list"), whoEl = $("#who");

  const fmt = t => {
    const d = new Date(t);
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts));
    let j = {};
    try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error(j.error || "请求失败");
    return j;
  }

  function paintUser() {
    if (me) {
      authPanel.style.display = "none";
      mePanel.style.display = "block";
      compose.classList.add("on");
      whoEl.innerHTML = `<span>已登录</span><b>${esc(me.nick)}</b>`;
      $("#meTitle").textContent = "你好，" + me.nick;
      $("#meSub").textContent = "在这个浏览器里保持登录 30 天";
    } else {
      authPanel.style.display = "block";
      mePanel.style.display = "none";
      compose.classList.remove("on");
      whoEl.innerHTML = "<span>未登录</span>";
    }
    $("#titleField").style.display = topic === "board" ? "flex" : "none";
  }

  async function load() {
    try {
      const j = await api("/api/posts?topic=" + topic);
      me = j.user || null;
      paintUser();
      render(j.posts);
    } catch (e) {
      listEl.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
    }
  }

  function render(posts) {
    if (!posts.length) {
      listEl.innerHTML = `<div class="empty">${topic === "board" ? "还没有人说话" : "灵感墙还是空的"}</div>`;
      return;
    }
    listEl.innerHTML = posts.map(p => `
      <article class="post" data-id="${p.id}">
        <div class="meta"><b>${esc(p.nick)}</b><span>·</span><span>${fmt(p.at)}</span></div>
        ${p.title ? `<h3>${esc(p.title)}</h3>` : ""}
        <p class="body">${esc(p.body)}</p>
        <div class="bar">
          <button class="pill like ${p.liked ? "liked" : ""}" type="button">♥ <span>${p.likes}</span></button>
          <button class="pill tog" type="button">回复 ${p.replies.length || ""}</button>
        </div>
        <div class="replies ${p.replies.length ? "" : ""}">
          ${p.replies.map(r => `<div class="reply"><span class="who2">${esc(r.nick)}</span>${esc(r.body)}</div>`).join("")}
          <div class="replyform">
            <input placeholder="回复…" maxlength="1000">
            <button class="pill send" type="button">发送</button>
          </div>
        </div>
      </article>`).join("");
  }

  /* 事件 */
  listEl.addEventListener("click", async e => {
    const post = e.target.closest(".post");
    if (!post) return;
    const id = post.dataset.id;

    if (e.target.closest(".tog")) {
      const r = post.querySelector(".replies");
      r.classList.toggle("on");
      return;
    }
    if (e.target.closest(".like")) {
      try {
        const j = await api(`/api/posts/${id}/like`, { method: "POST" });
        const b = post.querySelector(".like");
        b.querySelector("span").textContent = j.likes;
        b.classList.toggle("liked", j.liked);
      } catch (err) { alert(err.message); }
      return;
    }
    if (e.target.closest(".send")) {
      const input = post.querySelector(".replyform input");
      const body = input.value.trim();
      if (!body) return;
      try {
        await api(`/api/posts/${id}/reply`, { method: "POST", body: JSON.stringify({ body }) });
        load();
      } catch (err) { alert(err.message); }
    }
  });

  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
      t.classList.add("on");
      topic = t.dataset.topic;
      $("#titleField").style.display = topic === "board" ? "flex" : "none";
      load();
    });
  });

  $("#btnLogin").addEventListener("click", async () => {
    const account = $("#account").value.trim(), pass = $("#pass").value;
    $("#authMsg").textContent = "";
    try {
      const j = await api("/api/login", { method: "POST", body: JSON.stringify({ account, pass }) });
      me = j.user; $("#pass").value = ""; await load();
    } catch (e) { $("#authMsg").textContent = e.message; }
  });

  $("#btnReg").addEventListener("click", async () => {
    const account = $("#account").value.trim();
    const nick = $("#nick").value.trim();
    const pass = $("#pass").value;
    $("#authMsg").textContent = "";
    try {
      const j = await api("/api/register", { method: "POST", body: JSON.stringify({ account, nick, pass }) });
      me = j.user; $("#pass").value = ""; await load();
    } catch (e) { $("#authMsg").textContent = e.message; }
  });

  $("#btnLogout").addEventListener("click", async () => {
    try { await api("/api/logout", { method: "POST" }); } catch {}
    me = null; await load();
  });

  $("#btnPost").addEventListener("click", async () => {
    const title = $("#postTitle").value.trim();
    const body = $("#postBody").value.trim();
    $("#postMsg").textContent = "";
    try {
      await api("/api/posts", { method: "POST", body: JSON.stringify({ topic, title, body }) });
      $("#postTitle").value = ""; $("#postBody").value = "";
      await load();
    } catch (e) { $("#postMsg").textContent = e.message; }
  });

  /* ── 投稿 ─────────────────────────────────────────────── */
  const upFile = $("#upFile"), upMsg = $("#upMsg"), upList = $("#upList");
  $("#btnPick").addEventListener("click", () => upFile.click());

  function downscale(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 2000;
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.86));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("读不了这个文件")); };
      img.src = url;
    });
  }

  async function loadUploads() {
    try {
      const r = await fetch("/api/uploads", { credentials: "same-origin", cache: "no-store" });
      const j = await r.json();
      const list = j.uploads || [];
      upList.innerHTML = list.length
        ? list.map(u => `<figure class="post" style="margin:0;padding:10px">
            <img src="photos/${u.file}" alt="" style="width:100%;border-radius:8px;display:block">
            <figcaption class="meta" style="margin-top:8px">${u.title || "投稿"} · ${u.nick}</figcaption>
          </figure>`).join("")
        : `<div class="empty">还没有人投稿</div>`;
      upList.style.display = "grid";
      upList.style.gridTemplateColumns = "repeat(auto-fill,minmax(150px,1fr))";
      upList.style.gap = "12px";
    } catch {}
  }

  upFile.addEventListener("change", async () => {
    const f = upFile.files && upFile.files[0];
    if (!f) return;
    upMsg.textContent = "上传中…";
    try {
      const data = await downscale(f);
      const r = await fetch("/api/uploads", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data, title: $("#upTitle").value.trim() })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "上传失败");
      upMsg.textContent = "已提交，作者审核通过后会展示";
      upFile.value = ""; $("#upTitle").value = "";
      loadUploads();
    } catch (e) { upMsg.textContent = e.message; }
  });

  loadUploads();\n  load();\n})();
</script>
</body>
</html>
