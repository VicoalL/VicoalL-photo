<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS — VicoalL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --surface:#0d0b18;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface);color:#fff}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1600px;margin:0 auto;padding:0 clamp(16px,3vw,44px)}

.top{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px clamp(16px,3vw,44px);
  border-bottom:1px solid rgb(255 255 255 / .12);
  background:rgba(13,11,24,.7);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
}
.back{display:inline-flex;align-items:center;gap:7px;opacity:.85}
.back:hover{opacity:.5}
.top .meta{color:rgb(255 255 255 / .5)}

/* ── 头图 ─────────────────────────────────────────────── */
.hero{
  position:relative;height:clamp(320px,64vh,720px);
  overflow:hidden;background:#05050a;
}
.hero img{
  width:100%;height:100%;object-fit:cover;object-position:50% 38%;
  filter:brightness(.82);
}
.hero-in{
  position:absolute;left:0;right:0;bottom:0;
  padding:clamp(22px,4vw,54px);
  background:linear-gradient(to top,rgba(8,6,16,.94),rgba(8,6,16,.35) 60%,transparent);
}
.hero-in .k{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgb(255 255 255 / .6);margin:0 0 12px;
}
.hero-in h1{
  margin:0;font-size:clamp(38px,7.5vw,118px);line-height:.92;
  font-weight:400;letter-spacing:-.04em;
}
.hero-in p{margin:16px 0 0;max-width:52ch;font-size:14px;line-height:1.75;color:rgb(255 255 255 / .66)}

/* ── 门禁 ─────────────────────────────────────────────── */
.gate{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:78vh;padding:clamp(40px,8vw,110px) 20px;text-align:center;
}
.gate .lock{
  width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;margin-bottom:26px;
  border:1px solid rgb(255 255 255 / .22);
  color:rgb(255 255 255 / .75);
}
.gate h2{
  margin:0 0 10px;font-size:clamp(22px,3vw,32px);font-weight:400;letter-spacing:-.02em;
}
.gate .q{margin:0 0 30px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:rgb(255 255 255 / .5)}
.answer{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:center}
.cell{
  width:52px;height:64px;text-align:center;
  font-family:var(--sans);font-size:28px;color:#fff;
  background:rgb(255 255 255 / .06);
  border:1px solid rgb(255 255 255 / .25);
  border-radius:6px;outline:none;
  transition:border-color .25s,background .25s,transform .25s;
}
.cell:focus{border-color:#fff;background:rgb(255 255 255 / .12);transform:translateY(-2px)}
.suffix{font-size:17px;letter-spacing:.06em;color:rgb(255 255 255 / .85);padding-bottom:14px}
.gate .go{
  margin-top:30px;cursor:pointer;
  padding:12px 30px;border-radius:999px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#0d0b18;background:#fff;border:none;
  transition:opacity .25s,transform .25s;
}
.gate .go:hover{opacity:.82;transform:translateY(-1px)}
.gate .err{
  margin-top:18px;min-height:18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#ff8a8a;
  opacity:0;transition:opacity .2s;
}
.gate .err.on{opacity:1}
.gate .hintline{margin-top:34px;font-family:var(--mono);font-size:10.5px;color:rgb(255 255 255 / .32)}
.shake{animation:shake .38s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}

/* ── 照片区 ───────────────────────────────────────────── */
.album{display:none;padding-bottom:clamp(60px,10vw,140px)}
.album.on{display:block;animation:fade .6s var(--ease-soft)}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.album-head{padding:clamp(30px,5vw,70px) 0 clamp(16px,2vw,26px)}
.album-head h2{margin:0 0 12px;font-size:clamp(26px,4vw,54px);font-weight:400;letter-spacing:-.03em}
.album-head p{margin:0;font-family:var(--mono);font-size:11px;color:rgb(255 255 255 / .5);letter-spacing:.06em}

.rows{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.row.step{margin-top:clamp(18px,2.4vw,36px)}
.ph{
  position:relative;margin:0;overflow:hidden;cursor:zoom-in;
  border:1px solid rgb(255 255 255 / .14);
  opacity:0;transform:translateY(12px);
  transition:opacity .7s var(--ease-out),transform .7s var(--ease-out),
             border-color .35s,box-shadow .5s;
}
.ph.in{opacity:1;transform:none}
.ph:hover{border-color:rgb(255 255 255 / .6);box-shadow:0 26px 64px -26px rgb(0 0 0 / .85);z-index:3}
.ph img{display:block;width:100%;height:auto;
  transition:transform .95s cubic-bezier(.16,1,.3,1),filter .5s}
.ph:hover img{transform:scale(1.075);filter:brightness(1.09) saturate(1.06)}
.ph figcaption{
  position:absolute;left:0;right:0;top:0;padding:12px 12px 26px;
  font-family:var(--mono);font-size:10px;color:#fff;
  background:linear-gradient(to bottom,rgb(0 0 0 / .6),transparent);
  opacity:0;transition:opacity .3s;
}
.ph:hover figcaption{opacity:1}

/* ── 灯箱 ─────────────────────────────────────────────── */
.lb{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgb(5 5 8 / .97);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.lb[data-open]{display:grid;animation:fade .25s var(--ease-soft)}
.lb img{max-width:min(90vw,1500px);max-height:80vh;display:block;
  box-shadow:0 40px 120px -30px rgb(0 0 0 / .9)}
.lb-close,.lb-nav{
  position:absolute;z-index:2;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .2);
  transition:background .25s;
}
.lb-close{top:18px;right:22px;width:38px;height:38px;font-size:14px}
.lb-nav{top:50%;translate:0 -50%;width:52px;height:52px;font-size:15px}
.lb-prev{left:2.2vw}.lb-next{right:2.2vw}
.lb-close:hover,.lb-nav:hover{background:rgb(255 255 255 / .16)}
.lb-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
  gap:20px;padding:15px 22px;font-family:var(--mono);font-size:11px;
  color:rgb(255 255 255 / .75);border-top:1px solid rgb(255 255 255 / .12)}

@media (max-width:820px){
  .cell{width:44px;height:56px;font-size:24px}
  .row{grid-template-columns:repeat(6,minmax(0,1fr))}
  .row .ph{grid-column:span 6 !important}
  .row .ph:nth-child(2n){grid-column:span 3 !important}
  .row .ph:nth-child(2n+1){grid-column:span 3 !important}
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html"><span>←</span> 返回</a>
  <span class="meta">COS · 角色扮演</span>
</header>

<section class="hero">
  <img src="photos/web/cos/_DSC0736-已增强-降噪.jpg" alt="社团活动合照">
  <div class="hero-in">
    <p class="k">COS · Group Photo</p>
    <h1>角色扮演</h1>
    <p>社团活动现场。二十来个角色挤在一间教室里，粉笔灰都还没落下来。</p>
  </div>
</section>

<section class="gate" id="gate">
  <div class="lock">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="3.5" y="8.5" width="13" height="8.5" rx="1.6" stroke="currentColor" stroke-width="1.2"/>
      <path d="M6.6 8.5V6.2a3.4 3.4 0 0 1 6.8 0v2.3" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="10" cy="12.8" r="1.1" fill="currentColor"/>
    </svg>
  </div>
  <h2>这里要先对个暗号</h2>
  <p class="q">动漫社名称</p>

  <div class="answer" id="answer">
    <input class="cell" id="a1" type="text" inputmode="text" maxlength="1" autocomplete="off" aria-label="第一个字">
    <input class="cell" id="a2" type="text" inputmode="text" maxlength="1" autocomplete="off" aria-label="第二个字">
    <span class="suffix">动漫社</span>
  </div>

  <button class="go" id="go" type="button">进入照片</button>
  <p class="err" id="err">不对，再想想</p>
  <p class="hintline">提示：社刊封面上的两个字</p>
</section>

<section class="album" id="album">
  <div class="wrap">
    <div class="album-head">
      <h2>社员照片</h2>
      <p><span id="cnt">0</span> 张 · 点开看大图 · ← → 切换</p>
    </div>
    <div class="rows" id="rows"></div>
  </div>
</section>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="照片大图">
  <button class="lb-close" type="button" aria-label="关闭">✕</button>
  <button class="lb-nav lb-prev" type="button" aria-label="上一张">←</button>
  <img alt="">
  <button class="lb-nav lb-next" type="button" aria-label="下一张">→</button>
  <div class="lb-bar"><span id="lbcap"></span><span id="lbcnt"></span></div>
</div>

<script src="photos.js"></script>
<script src="photo-comments.js"></script>
<script>
(() => {
  "use strict";
  const SITE = window.SITE || {};
  const ch = (SITE.chapters || {}).cos;
  const ANSWER = String.fromCharCode(26143, 26790); // 社名，不写成明文

  const gate = document.getElementById("gate");
  const answer = document.getElementById("answer");
  const err = document.getElementById("err");
  const a1 = document.getElementById("a1");
  const a2 = document.getElementById("a2");

  /* 两个字自动跳格 */
  [a1, a2].forEach((el, i) => {
    el.addEventListener("input", () => {
      if (el.value.length >= 1) {
        if (i === 0) a2.focus();
        else el.blur();
      }
      err.classList.remove("on");
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") submit();
    });
  });
  a1.focus();

  function submit() {
    const v = (a1.value + a2.value).trim();
    if (v === ANSWER) {
      gate.style.display = "none";
      document.getElementById("album").classList.add("on");
      render();
      history.replaceState(null, "", "#photos");
      window.scrollTo({ top: document.querySelector(".album").offsetTop - 60, behavior: "smooth" });
    } else {
      err.classList.add("on");
      answer.classList.remove("shake");
      void answer.offsetWidth;
      answer.classList.add("shake");
      a1.value = ""; a2.value = "";
      a1.focus();
    }
  }
  document.getElementById("go").addEventListener("click", submit);

  /* ── 渲染照片 ─────────────────────────────────────────── */
  const rowsBox = document.getElementById("rows");
  const light = [];
  let built = false;

  function plan(list) {
    const rows = []; let i = 0;
    while (i < list.length) {
      const ar = list[i].w / list[i].h;
      let n;
      if (ar >= 2.0) n = 1;
      else if (ar < 1.0) n = (i + 1 < list.length) ? 2 : 1;
      else if (ar >= 1.45) n = 3;
      else n = 2;
      rows.push(list.slice(i, i + n));
      i += n;
    }
    return rows;
  }
  function spans(items) {
    const ars = items.map(p => p.w / p.h);
    if (items.length === 1) return [Math.max(4, Math.min(12, Math.round(ars[0] * 6)))];
    const sum = ars.reduce((a, b) => a + b, 0);
    let out = ars.map(a => Math.round(a / sum * 12));
    let d = 12 - out.reduce((a, b) => a + b, 0), k = 0;
    while (d !== 0) {
      const idx = k % out.length;
      if (d > 0) { out[idx]++; d--; } else if (out[idx] > 2) { out[idx]--; d++; }
      k++;
    }
    return out;
  }

  function render() {
    if (built || !ch) return;
    built = true;
    const list = ch.photos.filter(p => p.pick);
    document.getElementById("cnt").textContent = list.length;

    plan(list).forEach((row, ri) => {
      const sp = spans(row);
      const el = document.createElement("div");
      el.className = "row" + (ri % 4 === 3 ? " step" : "");
      row.forEach((p, k) => {
        const fig = document.createElement("figure");
        fig.className = "ph";
        fig.dataset.i = light.length;
        fig.style.gridColumn = `span ${sp[k]}`;
        fig.style.aspectRatio = `${p.w} / ${p.h}`;
        fig.innerHTML =
          `<img src="photos/thumb/cos/${encodeURIComponent(p.f)}" loading="lazy" decoding="async" alt="">` +
          `<figcaption>${(p.f.match(/_DSC(\d+)/) || [, ""])[1]}</figcaption>`;
        el.appendChild(fig);
        light.push({ src: `photos/web/cos/${encodeURIComponent(p.f)}`, p });
      });
      rowsBox.appendChild(el);
    });

    const io = new IntersectionObserver(es => {
      es.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        io.unobserve(e.target);
      });
    }, { threshold: .08 });
    document.querySelectorAll(".ph").forEach(f => io.observe(f));
  }

  /* ── 灯箱 ─────────────────────────────────────────────── */
  const lb = document.getElementById("lb");
  const img = lb.querySelector("img");
  const cap = document.getElementById("lbcap");
  const cnt = document.getElementById("lbcnt");
  let at = 0;

  function show(i) {
    if (!light.length) return;
    at = (i + light.length) % light.length;
    const it = light[at];
    img.src = it.src;
    cap.textContent = "COS · 角色扮演";
    cnt.textContent = `${String(at + 1).padStart(2, "0")} / ${String(light.length).padStart(2, "0")}`;
  }
  function open(i) { show(i); lb.dataset.open = ""; document.body.style.overflow = "hidden"; }
  function close() { delete lb.dataset.open; document.body.style.overflow = ""; }

  rowsBox.addEventListener("click", e => {
    const fig = e.target.closest(".ph");
    if (fig) open(+fig.dataset.i);
  });
  lb.addEventListener("click", e => {
    if (e.target.classList.contains("lb-close") || e.target === lb) close();
    else if (e.target.closest(".lb-prev")) show(at - 1);
    else if (e.target.closest(".lb-next")) show(at + 1);
  });
  addEventListener("keydown", e => {
    if (!("open" in lb.dataset)) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });

  /* 已经进来过就免答 */
  if (sessionStorage.getItem("cos-ok") === "1") {
    gate.style.display = "none";
    document.getElementById("album").classList.add("on");
    render();
  }
  const origSubmit = submit;
  document.getElementById("go").addEventListener("click", () => {
    if ((a1.value + a2.value).trim() === ANSWER) sessionStorage.setItem("cos-ok", "1");
  });
})();
</script>
</body>
</html>
