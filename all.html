<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部 — VicoalL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#00693f;
  --ink:#fff;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .4s var(--ease-soft);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1680px;margin:0 auto;padding:0 clamp(16px,3vw,44px)}

.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:16px clamp(16px,3vw,44px);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid rgb(255 255 255 / .16);
}
.back{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;opacity:.9;
}
.back:hover{opacity:.6}
.back span{font-size:13px;line-height:1}

.head{padding:clamp(28px,5vw,64px) 0 clamp(18px,2.4vw,30px)}
h1{
  margin:0;font-size:clamp(40px,7vw,110px);line-height:.92;
  font-weight:400;letter-spacing:-.035em;
}
.sub{
  margin:14px 0 0;font-family:var(--mono);font-size:11.5px;line-height:1.7;
  letter-spacing:.02em;color:rgb(255 255 255 / .72);
}
.sub b{font-weight:400;color:#fff}

.grid{
  column-count:4;column-gap:14px;
  padding-bottom:clamp(60px,8vw,120px);
}
.ph{
  position:relative;margin:0 0 14px;width:100%;break-inside:avoid;
  overflow:hidden;cursor:zoom-in;
  border:1px solid rgb(255 255 255 / .14);
  background:color-mix(in srgb,var(--surface) 62%,#040406);
  opacity:0;transform:translateY(10px);
  transition:opacity .7s var(--ease-out),transform .7s var(--ease-out),border-color .3s;
}
.ph.in{opacity:1;transform:none}
.ph:hover{border-color:rgb(255 255 255 / .45)}
.ph img{display:block;width:100%;height:auto;transition:transform .7s var(--ease-out)}
.ph:hover img{transform:scale(1.03)}
.ph figcaption{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:24px 10px 8px;
  font-family:var(--mono);font-size:9.5px;line-height:1.35;color:rgb(255 255 255 / .94);
  background:linear-gradient(to top,rgb(0 0 0 / .74),transparent);
  opacity:0;transition:opacity .3s var(--ease-soft);
}
.ph:hover figcaption{opacity:1}
.ph figcaption b{font-weight:400}
.ph figcaption span{color:rgb(255 255 255 / .6);white-space:nowrap}

/* lightbox */
.lb{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgb(5 5 8 / .965);
  -webkit-backdrop-filter:blur(12px) saturate(.75);backdrop-filter:blur(12px) saturate(.75);
}
.lb[data-open]{display:grid;animation:lbin .28s var(--ease-soft)}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb img{
  max-width:min(90vw,1500px);max-height:78vh;display:block;
  box-shadow:0 40px 120px -30px rgb(0 0 0 / .9);
  animation:lbimg .4s var(--ease-out);
}
@keyframes lbimg{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.lb-close,.lb-nav{
  position:absolute;z-index:2;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .2);
  transition:background .25s;
}
.lb-close{top:18px;right:22px;width:38px;height:38px;font-size:14px}
.lb-nav{top:50%;translate:0 -50%;width:52px;height:52px;font-size:15px}
.lb-prev{left:2.2vw}.lb-next{right:2.2vw}
.lb-close:hover,.lb-nav:hover{background:rgb(255 255 255 / .16)}
.lb-bar{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:15px 22px;font-family:var(--mono);font-size:11px;line-height:1.5;
  color:rgb(255 255 255 / .8);border-top:1px solid rgb(255 255 255 / .12);
}
.lb-cap b{font-weight:400;color:#fff}
.lb-cap span{display:block;color:rgb(255 255 255 / .5);margin-top:2px}
.lb-count{color:rgb(255 255 255 / .6);white-space:nowrap;font-variant-numeric:tabular-nums}

@media (max-width:1200px){.grid{column-count:3}}
@media (max-width:820px){.grid{column-count:2}.lb img{max-width:94vw;max-height:70vh}}
@media (max-width:520px){.grid{column-count:1}}
</style>
</head>
<body>

<header class="top">
  <a class="back" data-back href="index.html"><span>←</span> 返回</a>
  <p class="sub" style="margin:0"><b data-title></b> · <span data-count></span></p>
</header>

<main class="wrap">
  <div class="head">
    <h1 data-title>全部</h1>
    <p class="sub"><b data-name></b> — <span data-range></span></p>
  </div>
  <div class="grid" data-all></div>
</main>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="照片大图">
  <button class="lb-close" type="button" aria-label="关闭">✕</button>
  <button class="lb-nav lb-prev" type="button" aria-label="上一张">←</button>
  <img alt="" />
  <button class="lb-nav lb-next" type="button" aria-label="下一张">→</button>
  <div class="lb-bar">
    <p class="lb-cap"></p>
    <p class="lb-count num"></p>
  </div>
</div>

<script src="photos.js"></script>
<script src="gallery.js"></script>
</body>
</html>
