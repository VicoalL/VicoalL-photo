<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>无极 — VicoalL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#08080a;color:#fff}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── 画布 ─────────────────────────────────────────────── */
.plane{
  position:fixed;inset:0;overflow:hidden;
  cursor:grab;touch-action:none;
  background:
    radial-gradient(circle at 50% 50%, #14141a 0%, #08080a 70%);
}
.plane.dragging{cursor:grabbing}

.tile{
  position:absolute;left:0;top:0;
  overflow:hidden;
  border:1px solid rgb(255 255 255 / .14);
  background:#101014;
  transform-origin:50% 50%;
  will-change:transform;
  visibility:hidden;
}
.tile img{
  display:block;width:100%;height:100%;object-fit:cover;
  pointer-events:none;user-select:none;-webkit-user-drag:none;
}
.tile.loaded{border-color:rgb(255 255 255 / .18)}

/* 边缘压暗，让缩小更自然 */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(circle at 50% 50%,
    transparent 30%,
    rgba(8,8,10,.40) 66%,
    rgba(8,8,10,.82) 100%);
}

/* ── 顶栏 ─────────────────────────────────────────────── */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px clamp(16px,3vw,32px);
  border-bottom:1px solid rgb(255 255 255 / .1);
  background:linear-gradient(to bottom,rgba(8,8,10,.9),rgba(8,8,10,.35));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
}
.bar .left{display:flex;align-items:center;gap:18px;min-width:0}
.bar .back{display:inline-flex;align-items:center;gap:7px;opacity:.85;white-space:nowrap}
.bar .back:hover{opacity:.5}
.bar h1{
  margin:0;font-family:var(--sans);font-size:13px;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;opacity:.95;white-space:nowrap;
}
.bar .meta{color:rgb(255 255 255 / .55);white-space:nowrap}
.bar .right{display:flex;align-items:center;gap:10px}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 13px;border-radius:999px;cursor:pointer;
  color:#fff;background:rgb(255 255 255 / .08);
  border:1px solid rgb(255 255 255 / .2);
  transition:background .25s,border-color .25s;
}
.btn:hover{background:rgb(255 255 255 / .18);border-color:rgb(255 255 255 / .38)}

/* ── 提示 ─────────────────────────────────────────────── */
.hint{
  position:fixed;left:50%;bottom:34px;translate:-50% 0;z-index:6;
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;border-radius:999px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:rgb(255 255 255 / .78);
  background:rgb(12 12 16 / .72);
  border:1px solid rgb(255 255 255 / .16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .5s var(--ease-soft),translate .5s var(--ease-soft);
  pointer-events:none;
}
.hint i{font-style:normal;font-size:13px;line-height:1;opacity:.7}
.hint.gone{opacity:0;translate:-50% 12px}

/* ── 灯箱 ─────────────────────────────────────────────── */
.lb{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgb(5 5 8 / .965);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.lb[data-open]{display:grid;animation:lbin .25s var(--ease-soft)}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb img{
  max-width:min(90vw,1500px);max-height:78vh;display:block;
  box-shadow:0 40px 120px -30px rgb(0 0 0 / .9);
  animation:lbimg .4s var(--ease-out);
}
@keyframes lbimg{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.lb-close,.lb-nav{
  position:absolute;z-index:2;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .2);
  transition:background .25s;
}
.lb-close{top:18px;right:22px;width:38px;height:38px;font-size:14px}
.lb-nav{top:50%;translate:0 -50%;width:52px;height:52px;font-size:15px}
.lb-prev{left:2.2vw}.lb-next{right:2.2vw}
.lb-close:hover,.lb-nav:hover{background:rgb(255 255 255 / .16)}
.lb-bar{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:15px 22px;font-family:var(--mono);font-size:11px;line-height:1.5;
  color:rgb(255 255 255 / .8);border-top:1px solid rgb(255 255 255 / .12);
}
.lb-cap b{font-weight:400;color:#fff}
.lb-cap span{display:block;color:rgb(255 255 255 / .5);margin-top:2px}
.lb-count{color:rgb(255 255 255 / .6);white-space:nowrap;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  .bar h1{display:none}
  .bar .meta{display:none}
  .hint{font-size:10px;bottom:22px}
  .lb img{max-width:94vw;max-height:70vh}
}
</style>
</head>
<body>

<div class="plane" id="plane"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="bar">
  <div class="left">
    <a class="back" href="index.html"><span>←</span> 返回</a>
    <h1>无极 · All Photos</h1>
    <span class="meta"><span id="count">—</span> 张 · 拖动浏览</span>
  </div>
  <div class="right">
    <button class="btn" id="shuffle" type="button">随机位置</button>
  </div>
</header>

<div class="hint" id="hint"><i>✥</i>按住拖动，中间的照片会放大，边缘会缩小</div>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="照片大图">
  <button class="lb-close" type="button" aria-label="关闭">✕</button>
  <button class="lb-nav lb-prev" type="button" aria-label="上一张">←</button>
  <img alt="" />
  <button class="lb-nav lb-next" type="button" aria-label="下一张">→</button>
  <div class="lb-bar">
    <p class="lb-cap"></p>
    <p class="lb-count num"></p>
  </div>
</div>

<script src="photos.js"></script>
<script>
(() => {
  "use strict";
  const SITE = window.SITE;
  if (!SITE) return;

  /* ── 数据：所有章节 / 所有照片 ─────────────────────────── */
  const PHOTOS = [];
  Object.keys(SITE.chapters).forEach(slug => {
    const ch = SITE.chapters[slug];
    ch.photos.forEach(p => PHOTOS.push({ slug, ch, ...p }));
  });
  // 打散顺序，让画布上是各章节混在一起
  for (let i = PHOTOS.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = PHOTOS[i]; PHOTOS[i] = PHOTOS[j]; PHOTOS[j] = tmp;
  }

  const plane = document.getElementById("plane");
  const countEl = document.getElementById("count");
  countEl.textContent = PHOTOS.length;

  /* ── 确定性随机 ───────────────────────────────────────── */
  let seed = 20260816;
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  };

  /* ── 排布 ─────────────────────────────────────────────── */
  // 单元格尺寸随视口走：手机上照片相对更大
  const CELL = Math.round(Math.max(168, Math.min(238, innerWidth * 0.46)));
  const CELL_Y = Math.round(CELL * 0.9);
  const COLS = Math.max(10, Math.ceil(innerWidth / CELL * 1.55));
  const ROWS = Math.ceil(PHOTOS.length / COLS);
  const PLANE_W = COLS * CELL;
  const PLANE_H = ROWS * CELL_Y;

  const tiles = PHOTOS.map((p, i) => {
    const col = i % COLS;
    const row = Math.floor(i / COLS);

    // 三档画幅，让大小错落
    const r = rnd();
    const cls = r < 0.26 ? 0.82 : r < 0.80 ? 1.18 : 1.58;

    const ar = (p.w && p.h) ? p.w / p.h : 1.5;
    let w = CELL * cls;
    let h = w / ar;
    const cap = CELL * cls * 1.55;
    const floor = CELL * cls * 0.58;
    if (h > cap) { h = cap; w = h * ar; }
    if (h < floor) { h = floor; w = h * ar; }

    const jx = (rnd() - 0.5) * CELL * 0.55;
    const jy = (rnd() - 0.5) * CELL_Y * 0.55;

    return {
      el: null, img: null, src: null,
      p,
      w, h,
      cx: col * CELL + CELL / 2 + jx,
      cy: row * CELL_Y + CELL_Y / 2 + jy,
      shown: false, loaded: false
    };
  });

  /* ── 建 DOM（图片按需加载） ───────────────────────────── */
  const frag = document.createDocumentFragment();
  tiles.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tile";
    el.dataset.i = i;
    el.style.width = t.w + "px";
    el.style.height = t.h + "px";
    el.innerHTML = `<img alt="">`;
    t.el = el;
    t.img = el.firstElementChild;
    frag.appendChild(el);
  });
  plane.appendChild(frag);

  /* ── 视口 / 平移状态 ──────────────────────────────────── */
  let vw = innerWidth, vh = innerHeight;
  let panX = 0, panY = 0;
  let dragging = false;
  let moved = 0;
  let lastX = 0, lastY = 0;
  let velX = 0, velY = 0;
  let lastT = performance.now();

  function clampPan() {
    const minX = Math.min(0, vw - PLANE_W);
    const minY = Math.min(0, vh - PLANE_H);
    panX = Math.max(minX, Math.min(0, panX));
    panY = Math.max(minY, Math.min(0, panY));
  }
  function centreOn(x, y) {
    panX = vw / 2 - x;
    panY = vh / 2 - y;
    clampPan();
  }
  // 打开时先落在中间偏上
  centreOn(PLANE_W / 2, PLANE_H / 2);

  /* ── 渲染循环 ─────────────────────────────────────────── */
  const ease = t => t * t * (3 - 2 * t);
  const MAXR = () => Math.hypot(vw / 2, vh / 2);
  let raf = 0;

  function frame(now) {
    const dt = Math.min(64, now - lastT) || 16;
    lastT = now;

    // 惯性
    if (!dragging && (Math.abs(velX) > 0.08 || Math.abs(velY) > 0.08)) {
      panX += velX * (dt / 16);
      panY += velY * (dt / 16);
      const decay = Math.pow(0.94, dt / 16);
      velX *= decay; velY *= decay;
      clampPan();
    }

    const mx = vw / 2, my = vh / 2;
    const maxR = MAXR();
    const pad = 140;

    for (let i = 0; i < tiles.length; i++) {
      const t = tiles[i];
      const sx = t.cx + panX;
      const sy = t.cy + panY;

      // 视口裁剪
      const half = Math.max(t.w, t.h) * 0.9;
      if (sx + half < -pad || sx - half > vw + pad || sy + half < -pad || sy - half > vh + pad) {
        if (t.shown) { t.el.style.visibility = "hidden"; t.shown = false; }
        continue;
      }
      if (!t.shown) { t.el.style.visibility = "visible"; t.shown = true; }

      // 按需加载
      if (!t.loaded) {
        t.loaded = true;
        t.img.src = `photos/thumb/${t.p.slug}/${encodeURIComponent(t.p.f)}`;
        t.img.onload = () => t.el.classList.add("loaded");
      }

      // 离屏幕中心的距离 → 画幅
      const d = Math.hypot(sx - mx, sy - my);
      const n = Math.min(1, d / maxR);
      const s = 1.46 - 0.70 * ease(n);      // 中心 1.46，四角 0.76

      const tx = sx - t.w / 2;
      const ty = sy - t.h / 2;
      t.el.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(${s.toFixed(4)})`;
      t.el.style.zIndex = String(Math.round(s * 1000));
    }

    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  /* ── 拖动 ─────────────────────────────────────────────── */
  const hint = document.getElementById("hint");
  let hintGone = false;
  const killHint = () => { if (!hintGone) { hintGone = true; hint.classList.add("gone"); } };

  plane.addEventListener("pointerdown", e => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    dragging = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY;
    velX = velY = 0;
    plane.classList.add("dragging");
    try { plane.setPointerCapture(e.pointerId); } catch (_) {}
    killHint();
  });

  plane.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    panX += dx; panY += dy;
    moved += Math.abs(dx) + Math.abs(dy);
    velX = dx; velY = dy;
    clampPan();
  });

  const endDrag = e => {
    if (!dragging) return;
    dragging = false;
    plane.classList.remove("dragging");
    try { plane.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  plane.addEventListener("pointerup", e => {
    const wasClick = moved < 7;
    const idx = wasClick ? tileAt(e.clientX, e.clientY) : -1;
    endDrag(e);
    if (idx >= 0) openLight(idx);
  });
  plane.addEventListener("pointercancel", endDrag);
  plane.addEventListener("pointerleave", e => { if (dragging) endDrag(e); });

  /* 点击命中：从后往前找，考虑缩放 */
  function tileAt(x, y) {
    for (let i = tiles.length - 1; i >= 0; i--) {
      const t = tiles[i];
      if (!t.shown) continue;
      const sx = t.cx + panX, sy = t.cy + panY;
      const d = Math.hypot(sx - vw / 2, sy - vh / 2);
      const n = Math.min(1, d / MAXR());
      const s = 1.46 - 0.70 * ease(n);
      const hw = (t.w * s) / 2, hh = (t.h * s) / 2;
      if (x >= sx - hw && x <= sx + hw && y >= sy - hh && y <= sy + hh) return i;
    }
    return -1;
  }

  /* 滚轮平移 */
  plane.addEventListener("wheel", e => {
    e.preventDefault();
    panX -= e.deltaX;
    panY -= e.deltaY;
    clampPan();
    killHint();
  }, { passive: false });

  /* 键盘 */
  addEventListener("keydown", e => {
    const step = 160;
    if (e.key === "ArrowLeft")  { panX += step; clampPan(); }
    if (e.key === "ArrowRight") { panX -= step; clampPan(); }
    if (e.key === "ArrowUp")    { panY += step; clampPan(); }
    if (e.key === "ArrowDown")  { panY -= step; clampPan(); }
    if (e.key === "Escape" && "open" in lb.dataset) closeLight();
  });

  /* 随机跳 */
  document.getElementById("shuffle").addEventListener("click", () => {
    const t = tiles[Math.floor(Math.random() * tiles.length)];
    centreOn(t.cx, t.cy);
    killHint();
  });

  /* ── 灯箱 ─────────────────────────────────────────────── */
  const lb = document.getElementById("lb");
  const lbImg = lb.querySelector("img");
  const capEl = lb.querySelector(".lb-cap");
  const cntEl = lb.querySelector(".lb-count");
  let at = -1, order = [];

  const dateLine = p => (p.date ? p.date.replace(/-/g, ".") : "");
  const exifLine = p => {
    const b = [];
    if (p.focal) b.push(p.focal + "mm");
    if (p.fnum) b.push("ƒ/" + p.fnum);
    if (p.exp) b.push(p.exp + "s");
    if (p.iso) b.push("ISO" + p.iso);
    return b.join(" · ");
  };

  function show(i) {
    if (!order.length) return;
    at = (i + order.length) % order.length;
    const t = order[at];
    lbImg.src = `photos/web/${t.p.slug}/${encodeURIComponent(t.p.f)}`;
    const head = [dateLine(t.p), exifLine(t.p)].filter(Boolean).join("   ") || "未记录参数";
    capEl.innerHTML = `<b>${head}</b><span>${t.ch.title || ""}${t.p.cam ? " · " + t.p.cam : ""}</span>`;
    cntEl.textContent = `${String(at + 1).padStart(2, "0")} / ${String(order.length).padStart(2, "0")}`;
  }
  function openLight(i) {
    order = tiles.slice().sort((a, b) => tiles.indexOf(a) - tiles.indexOf(b));
    show(i);
    lb.dataset.open = "";
    lb.setAttribute("aria-hidden", "false");
  }
  function closeLight() {
    delete lb.dataset.open;
    lb.setAttribute("aria-hidden", "true");
  }
  lb.addEventListener("click", e => {
    if (e.target.classList.contains("lb-close") || e.target === lb) closeLight();
    else if (e.target.closest(".lb-prev")) show(at - 1);
    else if (e.target.closest(".lb-next")) show(at + 1);
  });
  addEventListener("keydown", e => {
    if (!("open" in lb.dataset)) return;
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  }, { passive: true });

  /* ── 尺寸变化 ─────────────────────────────────────────── */
  addEventListener("resize", () => {
    vw = innerWidth; vh = innerHeight;
    clampPan();
  });
})();
</script>
</body>
</html>
